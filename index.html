<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGM Yağış Arşivi</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{color-scheme:dark}
body{margin:0;background:#020817;color:#eef2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#071127;border:1px solid #26334f;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #0004}
h1,h2{margin:0 0 10px} label{display:block;margin:12px 0 6px;color:#b9c3d8}
input,select,button{font:inherit;border-radius:12px;border:1px solid #34425f;padding:13px;background:#0d172b;color:#fff}
input[type=file]{width:100%;box-sizing:border-box}
button{cursor:pointer;background:#008b08;border:0;font-weight:700}
button.secondary{background:#26344e}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:650px){.row{grid-template-columns:1fr}}
.progress{height:10px;background:#18233a;border-radius:99px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;width:0;background:#00c21a;transition:.2s}
#status{white-space:pre-wrap;color:#b9c3d8;margin-top:10px}
.raw{max-height:320px;overflow:auto;white-space:pre-wrap;font-family:monospace;font-size:13px;background:#020817;padding:14px;border-radius:14px}
table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{border:1px solid #31405d;padding:7px 9px;text-align:center;white-space:nowrap}
th{background:#111d34;position:sticky;top:0}
td.station{text-align:left;font-weight:600}
.small{font-size:13px;color:#93a0b8}
.ok{color:#64e26b}.warn{color:#ffcb57}
.records{max-height:350px;overflow:auto}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🌧️ MGM Yağış Arşivi</h1>
<div class="small">Fotoğraflar sadece OCR için kullanılır; fotoğraf dosyaları telefonda bu uygulama tarafından saklanmaz. Yalnızca yazı olarak çıkarılan kayıtlar saklanır.</div>
</div>

<div class="card">
<h2>📷 Görselleri Oku</h2>
<div class="row">
<div><label>Görsel tarihi</label><input id="date" type="date"></div>
<div><label>Görseller</label><input id="files" type="file" accept="image/*" multiple></div>
</div>
<button id="read">🔎 Seçilen görselleri oku</button>
<div class="progress"><div id="bar"></div></div>
<div id="status">Hazır.</div>
</div>

<div class="card">
<h2>📋 OCR Sonuçları</h2>
<div id="results" class="records"></div>
<button id="save">💾 Seçilenleri kaydet</button>
<button id="clearResults" class="secondary">🧹 Sonuçları temizle</button>
<details><summary>🔍 Ham OCR metni</summary><div id="raw" class="raw"></div></details>
</div>

<div class="card">
<h2>📊 Aylık Takip</h2>
<div class="row">
<div><label>İl</label><select id="province"><option value="">Tüm iller</option></select></div>
<div><label>Ay</label><input id="month" type="month"></div>
</div>
<div id="matrix" style="overflow:auto;margin-top:12px"></div>
<button id="export" class="secondary">⬇️ CSV olarak dışa aktar</button>
<button id="wipe" class="secondary">⚠️ Kayıtlı yazıları sil</button>
</div>
</main>

<script>
const DBKEY='mgm_yagis_v3_records';
let pending=[], rawAll='';
const $=id=>document.getElementById(id);
const PROVINCES=['Adana','Adıyaman','Afyonkarahisar','Ağrı','Aksaray','Amasya','Ankara','Antalya','Ardahan','Artvin','Aydın','Balıkesir','Bartın','Batman','Bayburt','Bilecik','Bingöl','Bitlis','Bolu','Burdur','Bursa','Çanakkale','Çankırı','Çorum','Denizli','Diyarbakır','Düzce','Edirne','Elazığ','Erzincan','Erzurum','Eskişehir','Gaziantep','Giresun','Gümüşhane','Hakkari','Hatay','Iğdır','Isparta','İstanbul','İzmir','Kahramanmaraş','Karabük','Karaman','Kars','Kastamonu','Kayseri','Kilis','Kırıkkale','Kırklareli','Kırşehir','Kocaeli','Konya','Kütahya','Malatya','Manisa','Mardin','Mersin','Muğla','Muş','Nevşehir','Niğde','Ordu','Osmaniye','Rize','Sakarya','Samsun','Siirt','Sinop','Sivas','Şanlıurfa','Şırnak','Tekirdağ','Tokat','Trabzon','Tunceli','Uşak','Van','Yalova','Yozgat','Zonguldak'];
PROVINCES.forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;$('province').appendChild(o)});
$('date').value=new Date().toISOString().slice(0,10);
$('month').value=new Date().toISOString().slice(0,7);

function norm(s){return (s||'').replace(/[|¦]/g,' ').replace(/\s+/g,' ').trim()}
function parseNum(s){
  s=norm(s).replace(/[Oo]/g,'0').replace(/[Il]/g,'1').replace(/[Ss]/g,'5').replace(/[Bb]/g,'8');
  let m=s.match(/(\d{1,3}(?:[.,]\d{1,2})?)/); if(!m)return null;
  let n=parseFloat(m[1].replace(',','.')); return Number.isFinite(n)&&n>=0&&n<=500?n:null;
}
function provinceOf(st){
  const n=norm(st).toLocaleLowerCase('tr-TR');
  return PROVINCES.find(p=>n.startsWith(p.toLocaleLowerCase('tr-TR')+',') || n===p.toLocaleLowerCase('tr-TR')) || st.split(',')[0].trim();
}
function shortStation(st){
  let a=norm(st).split(',').map(x=>x.trim()).filter(Boolean);
  return a.length>=3?a.slice(2).join(', '):a[a.length-1]||st;
}
function load(){try{return JSON.parse(localStorage.getItem(DBKEY)||'[]')}catch{return[]}}
function saveDB(a){localStorage.setItem(DBKEY,JSON.stringify(a))}
function setStatus(s){$('status').textContent=s}

async function imageBitmapFromFile(file){
  const bmp=await createImageBitmap(file);
  const max=1800, scale=Math.min(1,max/bmp.width);
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return c;
}
function crop(c,x0,x1){
  const o=document.createElement('canvas');o.width=Math.max(1,Math.round(c.width*(x1-x0)));o.height=c.height;
  o.getContext('2d').drawImage(c,Math.round(c.width*x0),0,o.width,c.height,0,0,o.width,c.height);return o;
}
function grayCanvas(c, invert=false){
  const o=document.createElement('canvas');o.width=c.width;o.height=c.height;
  const x=o.getContext('2d');x.drawImage(c,0,0);let d=x.getImageData(0,0,o.width,o.height), p=d.data;
  for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2]; if(invert)g=255-g; p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(d,0,0);return o;
}
function lineCenter(l){return (l.bbox?.y0+l.bbox?.y1)/2 || 0}
function lineText(l){return norm(l.text||'')}
function stationCandidates(lines){
  return (lines||[]).filter(l=>{
    const t=lineText(l);
    return t.includes(',') && /[A-Za-zÇĞİÖŞÜçğıöşü]/.test(t) && !/^(filtrele|bazlı|genel|yağış|mm)/i.test(t);
  });
}
function valueCandidates(lines){
  return (lines||[]).map(l=>({l,n:parseNum(lineText(l))})).filter(x=>x.n!==null);
}
function dedupeRows(rows){
  const m=new Map();
  for(const r of rows){
    const key=r.date+'|'+r.station.toLocaleLowerCase('tr-TR');
    if(!m.has(key) || m.get(key).mm<r.mm)m.set(key,r);
  }
  return [...m.values()];
}
async function recognize(worker, canvas, opts={}){
  const {data}=await worker.recognize(canvas, {rotateAuto:true}, opts);
  return data;
}

async function processFile(file, date, worker){
  const c=await imageBitmapFromFile(file);
  // MGM tablosunda istasyonlar solda, yağış sütunu sağdadır.
  // Sağ sütun için birkaç görüntü varyasyonu denenir; böylece kırmızı arka plan
  // veya farklı renkli değerler OCR'ı bozmaz.
  const left=crop(c,0,0.80);
  const right=crop(c,0.72,1.0);
  const stationData=await recognize(worker,grayCanvas(left,false),{});
  let stationLines=stationCandidates(stationData.lines||[]);
  let bestVals=[];
  for(const inv of [false,true]){
    const d=await recognize(worker,grayCanvas(right,inv),{});
    const vals=valueCandidates(d.lines||[]);
    if(vals.length>bestVals.length)bestVals=vals;
  }
  // OCR'ın gördüğü ham metni sakla; fotoğrafın kendisini değil.
  let raw='=== '+file.name+' ===\\n=== İSTASYON SÜTUNU OCR ===\\n'+(stationData.text||'')+
          '\\n=== YAĞIŞ SÜTUNU OCR ===\\n'+bestVals.map(x=>lineText(x.l)).join('\\n');
  // Y koordinatları farklı crop'larda aynı toplam görüntü yüksekliğindedir.
  // En yakın istasyon satırıyla eşleştir.
  const rows=[];
  for(const v of bestVals){
    const vy=lineCenter(v.l);
    let nearest=null, dist=1e9;
    for(const s of stationLines){
      const sy=lineCenter(s);
      const d=Math.abs(sy-vy);
      if(d<dist){dist=d;nearest=s}
    }
    if(nearest && dist<Math.max(38,c.height*0.035)){
      const st=lineText(nearest);
      if(st.length>5 && st.includes(',')) rows.push({date,station:st,province:provinceOf(st),mm:v.n,source:file.name});
    }
  }
  return {rows:dedupeRows(rows),raw};
}

async function runOCR(){
  const files=[...$('files').files]; const date=$('date').value;
  if(!files.length){setStatus('Önce görsel seç.');return}
  if(!date){setStatus('Tarih seç.');return}
  $('read').disabled=true; pending=[]; rawAll='';
  try{
    setStatus('OCR motoru hazırlanıyor...');
    const worker=await Tesseract.createWorker('tur');
    await worker.setParameters({preserve_interword_spaces:'1'});
    for(let i=0;i<files.length;i++){
      setStatus((i+1)+' / '+files.length+' görsel okunuyor...');
      $('bar').style.width=((i/files.length)*100)+'%';
      const r=await processFile(files[i],date,worker);
      pending.push(...r.rows); rawAll+='\\n'+r.raw+'\\n';
    }
    await worker.terminate();
    pending=dedupeRows(pending);
    $('bar').style.width='100%';
    $('raw').textContent=rawAll||'OCR metni oluşmadı.';
    renderResults();
    setStatus('Tamamlandı. '+pending.length+' aday kayıt bulundu. Değerler kırmızı olsa da olmasa da sağ sütundan ayrı OCR edildi.');
  }catch(e){console.error(e);setStatus('OCR hatası: '+e.message)}
  finally{$('read').disabled=false}
}

function renderResults(){
  if(!pending.length){$('results').innerHTML='<div class="warn">Uygun eşleşme bulunamadı. Ham OCR metnini açıp kontrol et.</div>';return}
  $('results').innerHTML=pending.map((r,i)=>`
  <div style="border:1px solid #2b3955;border-radius:14px;padding:10px;margin:8px 0">
    <input type="checkbox" data-i="${i}" checked>
    <input data-st="${i}" value="${esc(r.station)}" style="width:55%">
    <input data-mm="${i}" value="${r.mm}" inputmode="decimal" style="width:90px">
    <span class="small">${r.province}</span>
  </div>`).join('');
}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}

$('read').onclick=runOCR;
$('clearResults').onclick=()=>{pending=[];$('raw').textContent='';renderResults();setStatus('Sonuçlar temizlendi.')};
$('save').onclick=()=>{
  const db=load();
  const out=[];
  document.querySelectorAll('#results input[type=checkbox]').forEach(cb=>{
    if(!cb.checked)return;
    const i=+cb.dataset.i, st=document.querySelector(`[data-st="${i}"]`).value.trim();
    const mm=parseNum(document.querySelector(`[data-mm="${i}"]`).value);
    if(st&&mm!==null)out.push({date:pending[i].date,station:st,province:provinceOf(st),mm,source:pending[i].source});
  });
  saveDB(dedupeRows([...db,...out])); renderMatrix(); updateProvince();
  setStatus(out.length+' kayıt telefonda yazı olarak kaydedildi. Fotoğraf kaydedilmedi.');
};
function updateProvince(){
  const current=$('province').value, set=[...new Set(load().map(r=>r.province).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  $('province').innerHTML='<option value="">Tüm iller</option>'+set.map(p=>`<option>${esc(p)}</option>`).join('');
  $('province').value=set.includes(current)?current:'';
}
function renderMatrix(){
  const month=$('month').value, prov=$('province').value, db=load();
  const rec=db.filter(r=>r.date.startsWith(month)&&( !prov || r.province===prov));
  if(!rec.length){$('matrix').innerHTML='<div class="small">Bu filtrede kayıt yok.</div>';return}
  const stations=[...new Set(rec.map(r=>shortStation(r.station)))];
  const map=new Map(rec.map(r=>[r.date+'|'+shortStation(r.station),r.mm]));
  let h='<table><thead><tr><th>İl / Ay</th>'+stations.map(s=>`<th>${esc(s)}</th>`).join('')+'</tr></thead><tbody>';
  for(let d=1;d<=31;d++){
    const ds=month+'-'+String(d).padStart(2,'0');
    h+='<tr><td class="station">'+(prov||'Tüm iller')+' / '+month.slice(5)+'</td>';
    for(const s of stations){const v=map.get(ds+'|'+s);h+='<td>'+ (v??'') +'</td>'}
    h+='</tr>';
  }
  $('matrix').innerHTML=h+'</tbody></table>';
}
$('province').onchange=renderMatrix;$('month').onchange=renderMatrix;
$('export').onclick=()=>{
  const month=$('month').value, prov=$('province').value, db=load().filter(r=>r.date.startsWith(month)&&(!prov||r.province===prov));
  const csv=['Tarih,İl,İstasyon,Yağış_mm',...db.map(r=>[r.date,JSON.stringify(r.province),JSON.stringify(r.station),r.mm].join(','))].join('\\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='mgm-yagis-'+month+'.csv';a.click();
};
$('wipe').onclick=()=>{if(confirm('Telefonda saklanan tüm yazı kayıtları silinsin mi?')){localStorage.removeItem(DBKEY);updateProvince();renderMatrix();}};
updateProvince();renderMatrix();renderResults();
</script>
</body>
</html>
