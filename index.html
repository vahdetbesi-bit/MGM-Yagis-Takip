<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGM Yağış Arşivi</title><style>*{box-sizing:border-box}body{margin:0;background:#071027;color:#eef3ff;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:12px}h1{font-size:22px;margin:3px 0 12px}.card{background:#0b1630;border:1px solid #263b64;border-radius:14px;padding:14px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}label{display:block;color:#aebbd5;font-size:13px;margin:7px 0 4px}input,select,button{width:100%;padding:10px;border-radius:9px;border:1px solid #30446d;background:#101e3b;color:#fff;font-size:15px}button{background:#00a51a;border:0;font-weight:700}.small{color:#9daccc;font-size:13px}.status{margin:8px 0;color:#62e878}.tablewrap{overflow:auto;border:1px solid #33466d;border-radius:9px}table{border-collapse:collapse;min-width:700px;width:max-content;background:#08132b}th,td{border:1px solid #33466d;padding:8px 11px;text-align:center;white-space:nowrap}thead th{background:#101f3e;position:sticky;top:0;z-index:2}td:first-child,th:first-child{position:sticky;left:0;z-index:1;background:#0d1b36}thead th:first-child{z-index:3}.value{font-weight:700}.zero{color:#667898}@media(max-width:700px){.row{grid-template-columns:1fr}main{padding:9px}}</style></head><body><main><div class="card"><h1>🌧️ MGM Yağış Arşivi</h1><div class="small">Veriler MGM'nin yayınladığı HTML tablosundan otomatik arşivlenir. OCR kullanılmaz.</div><div class="row"><div><label>Başlangıç</label><input id="from" type="date"></div><div><label>Bitiş</label><input id="to" type="date"></div><div><label>İl</label><select id="province"><option value="">Tüm iller</option></select></div></div><div class="row"><div><label>İstasyon ara</label><input id="station" placeholder="Örn. GÖLKENT"></div><div><label>Gösterim</label><select id="mode"><option value="all">Tüm günler</option><option value="rain">Yağış olan günler</option></select></div><div><label>&nbsp;</label><button id="refresh">🔄 Veriyi yenile</button></div></div><div id="status" class="status">Veri yükleniyor...</div></div><div class="card"><div id="title" class="small"></div><div class="tablewrap"><table id="tbl"></table></div></div></main><script>let DATA=[];const $=id=>document.getElementById(id);function fmt(n){return Number(n).toLocaleString('tr-TR',{minimumFractionDigits:1,maximumFractionDigits:1})}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function loadFilters(){let ps=[...new Set(DATA.map(x=>x.province).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));$('province').innerHTML='<option value="">Tüm iller</option>'+ps.map(p=>`<option>${esc(p)}</option>`).join('');if(DATA.length){let ds=DATA.map(x=>x.date).sort();$('from').value=ds[0];$('to').value=ds.at(-1)}}function render(){let from=$('from').value,to=$('to').value,prov=$('province').value,q=$('station').value.trim().toLocaleUpperCase('tr-TR'),mode=$('mode').value;let rows=DATA.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)&&(!prov||x.province===prov)&&(!q||x.station.includes(q)));let days=[...new Set(rows.map(x=>x.date))].sort(),stations=[...new Set(rows.map(x=>x.station))].sort((a,b)=>a.localeCompare(b,'tr'));if(mode==='rain'){let good=new Set(rows.filter(x=>Number(x.mm)>0).map(x=>x.date));days=days.filter(d=>good.has(d))}$('title').textContent=(prov?prov+' — ':'')+'İstasyonlar üstte, günler solda';let h='<thead><tr><th>Gün</th>'+stations.map(s=>`<th>${esc(s)}</th>`).join('')+'</tr></thead><tbody>';for(let d of days){h+=`<tr><th>${d.slice(8,10)}-${d.slice(5,7)}</th>`;for(let s of stations){let r=rows.find(x=>x.date===d&&x.station===s);h+=r?`<td class="value">${fmt(r.mm)}</td>`:'<td class="zero">0,0</td>'}h+='</tr>'}if(!days.length||!stations.length)h+='<tr><td colspan="99">Bu filtreyle kayıt bulunamadı.</td></tr>';$('tbl').innerHTML=h}async function boot(){try{let r=await fetch('data.json?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data.json bulunamadı');DATA=await r.json();loadFilters();render();$('status').textContent=`Hazır: ${DATA.length.toLocaleString('tr-TR')} istasyon-gün kaydı`}catch(e){$('status').textContent='Veri yüklenemedi: '+e.message}}['from','to','province','station','mode'].forEach(id=>$(id).addEventListener('input',render));$('refresh').onclick=boot;boot();</script></body></html>
