<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGM Yağış Arşivi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101f;color:#f4f7ff;font-family:Arial,sans-serif}
main{max-width:1100px;margin:auto;padding:16px}.card{background:#09172b;border:1px solid #29405f;border-radius:18px;padding:16px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 8px}h2{font-size:19px;margin:0 0 10px}
label{display:block;color:#b9c6da;margin:9px 0 5px}input,select,button{font:inherit}
input[type=date],input[type=file],select{width:100%;padding:11px;background:#071226;color:#fff;border:1px solid #39506f;border-radius:10px}
button{border:0;border-radius:10px;padding:11px 15px;background:#00a51a;color:#fff;font-weight:bold;margin:7px 5px 0 0}
button:disabled{opacity:.5}.secondary{background:#263b5b}.danger{background:#8d1717}
.small{font-size:13px;color:#9eacc2;line-height:1.45}.status{margin-top:10px;color:#b9c6da}
.progress{height:7px;background:#14243c;border-radius:99px;margin-top:10px;overflow:hidden;display:none}.bar{height:100%;width:0;background:#00b51b}
.candidates{max-height:440px;overflow:auto;margin-top:10px}
.item{display:grid;grid-template-columns:24px 1fr 110px;gap:8px;align-items:center;border:1px solid #2a405f;border-radius:10px;padding:8px;margin:6px 0}
.item input{width:100%;padding:8px;background:#071226;color:#fff;border:1px solid #354b6b;border-radius:8px}
.item .station{font-size:13px}.item .mm{font-weight:bold}
.tablewrap{overflow:auto;border:1px solid #29405f;border-radius:12px}
table{border-collapse:collapse;min-width:max-content;width:100%}th,td{border:1px solid #3b506d;padding:8px 10px;text-align:center;white-space:nowrap}
thead th{background:#12233d;position:sticky;top:0;z-index:2}th:first-child,td:first-child{position:sticky;left:0;background:#0d1c33;z-index:3}
.zero{color:#718198}.rain{font-weight:bold}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:650px){.filters{grid-template-columns:1fr}.item{grid-template-columns:24px 1fr 90px}}
</style>
</head>
<body><main>

<section class="card">
<h1>🌧️ MGM Yağış Arşivi</h1>
<div class="small">Görsellerde birden fazla il olabilir. Yüklerken il seçme. Program istasyon satırından ili ve istasyonu ayırmaya çalışır.</div>

<label>Tarih</label>
<input id="date" type="date">
<label>O güne ait MGM görselleri</label>
<input id="files" type="file" accept="image/*" multiple>

<button id="scan">🔎 Görselleri tara</button>
<button id="save" class="secondary">💾 Bulunanları kaydet</button>
<button id="clear" class="danger">Tüm kayıtları sil</button>

<div class="progress" id="prog"><div class="bar" id="bar"></div></div>
<div class="status" id="status"></div>
</section>

<section class="card">
<h2>Kontrol edilen sonuçlar</h2>
<div class="small">Program emin olmadığı kayıtları burada bırakır. Kaydetmeden önce istasyon veya yağış değerini düzeltebilirsin.</div>
<div id="candidates" class="candidates"></div>
</section>

<section class="card">
<h2>📊 Takip tablosu</h2>
<div class="filters">
<div><label>İl</label><select id="province"><option value="">Tüm iller</option></select></div>
<div><label>Yıl</label><select id="year"><option value="">Tüm yıllar</option></select></div>
</div>
<div class="tablewrap" style="margin-top:12px"><table id="tbl"></table></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY="mgm_archive_final_2026";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");
let pending=[];

const $=x=>document.getElementById(x);
$("date").value=new Date().toISOString().slice(0,10);

function persist(){localStorage.setItem(KEY,JSON.stringify(db));}
function clean(s){return String(s||"").replace(/[|]/g,"I").replace(/\s+/g," ").trim();}
function num(s){
  s=String(s||"").trim()
    .replace(/[OoÖö]/g,"0").replace(/[Ilİı]/g,"1")
    .replace(/[Ss]/g,"5").replace(/[Bb]/g,"8")
    .replace(/,/g,".");
  let m=s.match(/^\D*(\d{1,4}(?:\.\d{1,2})?)\D*$/);
  if(!m)return null;
  let n=Number(m[1]); return Number.isFinite(n)&&n>=0&&n<=500?n:null;
}
function provinceStation(text){
  let t=clean(text);
  // MGM satırları genellikle "Sakarya, Ferizli, Gölkent" biçimindedir.
  let p=t.split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
  let province=p.length>=1?p[0]:"";
  let station=p.length>=3?p[p.length-1]:(p.length===2?p[1]:t);
  station=station.replace(/\b(BELDESİ|KÖYÜ|MERKEZ)\b/gi,"").replace(/\s+/g," ").trim();
  return {province,station};
}
function validStation(s){
  return s && s.length>=2 && /[A-Za-zÇĞİÖŞÜçğıöşü]/.test(s) &&
    !/^(İSTASYON|YAĞIŞ|TOPLAM|TARİH|TARIH|MM|GÜN)$/i.test(s);
}

function preprocess(src, x,y,w,h,mode){
  let c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*2)); c.height=Math.max(1,Math.round(h*2));
  let ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(src,x,y,w,h,0,0,c.width,c.height);
  let im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    if(mode==="binary") g=g>145?255:0;
    else if(mode==="contrast") g=Math.max(0,Math.min(255,(g-128)*1.7+128));
    d[i]=d[i+1]=d[i+2]=g;
  }
  ctx.putImageData(im,0,0); return c;
}

async function recognize(worker,canvas,psm,whitelist){
  let pars={tessedit_pageseg_mode:String(psm),preserve_interword_spaces:"1"};
  if(whitelist)pars.tessedit_char_whitelist=whitelist;
  await worker.setParameters(pars);
  return (await worker.recognize(canvas)).data;
}
function wordsFrom(data){
  return (data.words||[]).filter(w=>w.text&&w.confidence>=15).map(w=>({
    text:w.text.trim(),x0:w.bbox.x0,x1:w.bbox.x1,
    y0:w.bbox.y0,y1:w.bbox.y1,
    x:(w.bbox.x0+w.bbox.x1)/2,y:(w.bbox.y0+w.bbox.y1)/2,
    conf:w.confidence
  }));
}
function groupRows(words){
  let rows=[];
  [...words].sort((a,b)=>a.y-b.y).forEach(w=>{
    let r=rows.find(q=>Math.abs(q.y-w.y)<22);
    if(!r){r={y:w.y,words:[]};rows.push(r)}
    r.words.push(w);r.y=r.words.reduce((a,z)=>a+z.y,0)/r.words.length;
  });
  return rows.sort((a,b)=>a.y-b.y);
}

async function scanImage(file,worker){
  let url=URL.createObjectURL(file),im=await new Promise((res,rej)=>{
    let x=new Image();x.onload=()=>res(x);x.onerror=rej;x.src=url;
  });URL.revokeObjectURL(url);

  let max=2200,scale=Math.min(1,max/im.naturalWidth);
  let src=document.createElement("canvas");src.width=Math.round(im.naturalWidth*scale);src.height=Math.round(im.naturalHeight*scale);
  src.getContext("2d").drawImage(im,0,0,src.width,src.height);

  let W=src.width,H=src.height;
  /*
   * İki ayrı OCR:
   * Sol/orta bölüm: istasyon metni.
   * Sağ bölüm: sadece rakam.
   * Bu sayede kırmızı yağış hücresinin rengi OCR'ı bozmaz.
   */
  let left=preprocess(src,0,0,W*.82,H,"contrast");
  let right=preprocess(src,W*.68,0,W*.32,H,"binary");

  let L=await recognize(worker,left,6,null);
  let R=await recognize(worker,right,6,"0123456789,.");

  let lw=wordsFrom(L),rw=wordsFrom(R);
  let nums=rw.map(w=>({...w,n:num(w.text)})).filter(w=>w.n!==null);

  // Sağ OCR'daki aynı rakamı farklı psm/kelime parçaları olarak görürse en güvenilirini seç.
  let out=[];
  for(let n of nums){
    let row=lw.filter(w=>Math.abs(w.y-n.y)<34 && w.x<n.x);
    if(!row.length)continue;
    row.sort((a,b)=>a.x-b.x);
    let text=row.map(w=>w.text).join(" ");
    let ps=provinceStation(text);
    if(!validStation(ps.station))continue;

    // İstasyon adı mümkün olduğunca satırın son kısmıdır.
    out.push({province:ps.province,station:ps.station,mm:n.n,confidence:n.conf,y:n.y});
  }

  // Aynı istasyon birden fazla kez geldiyse en yüksek güveni tut.
  let m=new Map();
  for(let r of out){
    let k=(r.province+"|"+r.station).toLocaleUpperCase("tr-TR");
    if(!m.has(k)||r.confidence>m.get(k).confidence)m.set(k,r);
  }
  return [...m.values()];
}

function renderPending(){
  if(!pending.length){$("candidates").innerHTML='<div class="small">Kayıt bulunamadı.</div>';return;}
  $("candidates").innerHTML=pending.map((r,i)=>`
    <div class="item">
      <input type="checkbox" data-i="${i}" checked>
      <div class="station">
        <input data-s="${i}" value="${esc(r.station)}" title="İstasyon adı">
        <div class="small">${esc(r.province||"İl okunamadı")}</div>
      </div>
      <input class="mm" data-v="${i}" value="${String(r.mm).replace(".",",")}" inputmode="decimal">
    </div>`).join("");
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

$("scan").onclick=async()=>{
  let files=[...$("files").files],date=$("date").value;
  if(!date||!files.length){alert("Tarih ve görsel seç.");return;}
  pending=[];$("scan").disabled=true;$("prog").style.display="block";$("bar").style.width="0%";
  try{
    $("status").textContent="OCR motoru hazırlanıyor...";
    let worker=await Tesseract.createWorker("tur+eng",1,{logger:m=>{
      if(m.status==="recognizing text")$("bar").style.width=Math.round(m.progress*100)+"%";
    }});
    for(let i=0;i<files.length;i++){
      $("status").textContent=`${i+1}/${files.length} görsel işleniyor...`;
      let r=await scanImage(files[i],worker);pending.push(...r);
      $("bar").style.width=Math.round((i+1)/files.length*100)+"%";
    }
    await worker.terminate();renderPending();
    $("status").textContent=`Tarama tamamlandı: ${pending.length} aday kayıt.`;
  }catch(e){console.error(e);$("status").textContent="Tarama hatası: "+e.message;}
  finally{$("scan").disabled=false;$("prog").style.display="none";}
};

$("save").onclick=()=>{
  let date=$("date").value;if(!date||!pending.length)return;
  document.querySelectorAll(".item").forEach((el,i)=>{
    if(!el.querySelector('[data-i]').checked)return;
    let station=el.querySelector('[data-s]').value.trim();
    let mm=num(el.querySelector('[data-v]').value);
    let province=pending[i].province.trim();
    if(!validStation(station)||mm===null)return;
    // Aynı tarih + il + istasyon kaydını güncelle.
    db=db.filter(x=>!(x.date===date&&x.province===province&&x.station.toLocaleUpperCase("tr-TR")===station.toLocaleUpperCase("tr-TR")));
    db.push({date,province,station,mm});
  });
  persist();draw();$("status").textContent="Kayıtlar kaydedildi.";
};

$("clear").onclick=()=>{
  if(confirm("Telefonda tutulan bütün yağış kayıtları silinsin mi?")){
    db=[];persist();draw();pending=[];renderPending();
  }
};

function draw(){
  let p=$("province").value,y=$("year").value;
  let rows=db.filter(x=>(!p||x.province===p)&&(!y||x.date.startsWith(y)));
  let stations=[...new Set(rows.map(x=>x.province+"|"+x.station))].map(k=>{
    let [province,...s]=k.split("|");return {province,station:s.join("|")};
  }).sort((a,b)=>a.station.localeCompare(b.station,"tr"));
  let dates=[...new Set(rows.map(x=>x.date))].sort();
  let table=$("tbl");
  if(!dates.length){table.innerHTML="";return;}
  let h=`<thead><tr><th colspan="${stations.length+1}">${p||[...new Set(rows.map(x=>x.province))].join(" / ")}${y?" — "+y:""}</th></tr>`;
  h+="<tr><th>Gün</th>"+stations.map(s=>`<th>${esc(s.station)}</th>`).join("")+"</tr></thead><tbody>";
  let map=new Map(rows.map(x=>[x.date+"|"+x.province+"|"+x.station,x.mm]));
  dates.forEach(d=>{
    h+=`<tr><td>${d.slice(5)}</td>`;
    stations.forEach(s=>{
      let v=map.get(d+"|"+s.province+"|"+s.station);
      h+=`<td class="${v==null?"zero":"rain"}">${v==null?"0":String(v).replace(".",",")}</td>`;
    });h+="</tr>";
  });
  table.innerHTML=h+"</tbody>";
  fillFilters(false);
}
function fillFilters(keep=true){
  let p=$("province").value,y=$("year").value;
  let ps=[...new Set(db.map(x=>x.province))].sort((a,b)=>a.localeCompare(b,"tr"));
  let ys=[...new Set(db.map(x=>x.date.slice(0,4)))].sort().reverse();
  $("province").innerHTML='<option value="">Tüm iller</option>'+ps.map(x=>`<option>${esc(x)}</option>`).join("");
  $("year").innerHTML='<option value="">Tüm yıllar</option>'+ys.map(x=>`<option>${x}</option>`).join("");
  if(keep){$("province").value=ps.includes(p)?p:"";$("year").value=ys.includes(y)?y:"";}
}
$("province").onchange=draw;$("year").onchange=draw;
fillFilters();draw();
</script>
</main></body></html>
